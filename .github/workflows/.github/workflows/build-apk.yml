
name: Build SecretCalculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android Project
        id: locate
        shell: bash
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path '*/.gradle/*' -print -quit)
          if [ -z "$FILE" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found project at: $DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecretCalculator-Debug-APK
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
